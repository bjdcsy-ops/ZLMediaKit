name: Build ZLMediaKit

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

concurrency:
  group: zlmediakit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ARM64 build
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout ZLMediaKit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare Debian 11 ARM64 build image
        run: ./build-linux-arm64.sh image

      - name: Resolve build cache metadata
        id: build_cache
        run: ./build-linux-arm64.sh cache-info >>"$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: dependency_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.build_cache.outputs.dependency_cache_path }}
          key: zlmediakit-deps-debian11-arm64-${{ steps.build_cache.outputs.dependency_cache_key }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.build_cache.outputs.ccache_path }}
          key: zlmediakit-ccache-debian11-arm64-${{ steps.build_cache.outputs.builder_fingerprint }}-${{ github.sha }}
          restore-keys: |
            zlmediakit-ccache-debian11-arm64-${{ steps.build_cache.outputs.builder_fingerprint }}-

      - name: Validate build files
        run: ./build-linux-arm64.sh check

      - name: Build ZLMediaKit package
        run: ./build-linux-arm64.sh build

      - name: Archive ZLMediaKit package
        id: archive
        run: |
          archive_path=$(./build-linux-arm64.sh archive)
          printf 'path=%s\n' "$archive_path" >>"$GITHUB_OUTPUT"

      - name: Save dependency cache
        if: steps.dependency_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.build_cache.outputs.dependency_cache_path }}
          key: ${{ steps.dependency_cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: success() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.build_cache.outputs.ccache_path }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Attest ZLMediaKit package
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Upload ZLMediaKit package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.archive.outputs.path }}
          archive: false
          if-no-files-found: error
